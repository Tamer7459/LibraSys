services:
  - type: web
    name: librasys
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --workers=4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: librasys-db
          property: connectionString
    staticPublishPath: ./staticfiles

databases:
  - name: librasys-db
    databaseName: librasys
    plan: free
